<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Pattern ∞ v8 · Zero Signed-Mass Balancer</title>
<style>
:root{--bg:#f7f9fc;--card:#fff;--line:#d8e0ea;--text:#1a2332;--muted:#5c6b7e;--a:#3b6ef5;--a2:#2a5ce0;--ok:#0d9f6e;--w:#c47d00;--bad:#d93838;--shadow:0 4px 20px rgba(26,35,50,.06)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef3f9,#f7f9fc 45%,#f4f7fb);color:var(--text);font:13px Inter,system-ui,-apple-system,sans-serif;min-height:100vh}
.wrap{max-width:1240px;margin:auto;padding:18px 14px 50px}h1{font-size:1.25rem;margin:0 0 6px} .sub{color:var(--muted);font-size:12px;line-height:1.55;max-width:920px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.two{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}@media(max-width:860px){.two{grid-template-columns:1fr}}
label{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-bottom:5px}
select,input{width:100%;background:#f8fafc;color:var(--text);border:1px solid #cdd6e4;border-radius:9px;padding:9px 10px;font-size:13px}
select:focus,input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(59,110,245,.15)}
input:disabled,select:disabled{opacity:.65;background:#eef2f7}button{border:0;border-radius:10px;padding:10px 14px;background:var(--a);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
button:hover:not(:disabled){background:var(--a2)}button.s{background:#e8eef7;color:var(--text);border:1px solid #c5d0e0}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar{height:8px;border-radius:99px;background:#e4eaf2;overflow:hidden;margin-top:12px}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#3b6ef5,#0d9f6e)}
.view{background:#0f1419;border:1px solid #c5d0e0;border-radius:12px;overflow:hidden;aspect-ratio:1/1}.view canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.stat{background:#f5f8fc;border:1px solid #dce3ed;border-radius:10px;padding:8px 10px;font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--text);font-size:13px;margin-top:3px}
.log{background:#f8fafc;border:1px solid #dce3ed;border-radius:10px;min-height:90px;max-height:220px;overflow:auto;padding:10px 12px;font:11px/1.5 ui-monospace,Consolas,monospace;color:#334155}
